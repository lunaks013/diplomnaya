<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="518" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Поведенческие и нейрокогнитивные факторы</text>
  <text x="48" y="78" font-family="Arial, sans-serif" font-size="14" fill="#64748b">Теоретическая часть · анализ гемблинга и лудомании</text>
  
  <g transform="translate(48 110)">
    <rect width="260" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="118" rx="3" fill="#1e3a5f"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Иллюзия контроля</text>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      <tspan x="20" dy="0">Субъект выбирает ставку, но RNG независим </tspan>
      <tspan x="20" dy="18">от действий</tspan>
    </text>
  </g>
  
  <g transform="translate(330 110)">
    <rect width="260" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="118" rx="3" fill="#1e3a5f"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Повторное пополнение</text>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      <tspan x="20" dy="0">Маркер «отыгрыша» после серии проигрышей</tspan>
      <tspan x="20" dy="18"></tspan>
    </text>
  </g>
  
  <g transform="translate(612 110)">
    <rect width="260" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="118" rx="3" fill="#1e3a5f"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Эффект near-miss</text>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      <tspan x="20" dy="0">Исход, близкий к выигрышу, усиливает мотив</tspan>
      <tspan x="20" dy="18">ацию</tspan>
    </text>
  </g>
  
  <g transform="translate(894 110)">
    <rect width="260" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="0" y="0" width="6" height="118" rx="3" fill="#1e3a5f"/>
    <text x="20" y="32" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Инвариантность результата</text>
    <text x="20" y="56" font-family="Arial, sans-serif" font-size="12" fill="#475569">
      <tspan x="20" dy="0">E[Δ] &lt; 0 при любом механизме RNG</tspan>
      <tspan x="20" dy="18"></tspan>
    </text>
  </g>
  <g transform="translate(48 270)">
    <rect width="520" height="220" rx="12" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
    <text x="260" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a5f">Схема взаимодействия зон</text>
    <ellipse cx="260" cy="120" rx="120" ry="70" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="200" cy="95" rx="55" ry="35" fill="#dbeafe" stroke="#1e3a5f" opacity="0.7"/>
    <text x="200" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e3a5f">Контроль (ПФК)</text>
    <ellipse cx="310" cy="130" rx="45" ry="30" fill="#fee2e2" stroke="#dc2626" opacity="0.8"/>
    <text x="310" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">Награда (НС)</text>
    <path d="M200 130 Q260 170 310 150" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/>
    <text x="260" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Зависимость</text>
  </g>
  <g transform="translate(600 270)">
    <rect width="552" height="220" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="276" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1e3a5f">Зависимость: активация зон мозга</text>
    <text x="40" y="70" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Контроль (ПФК)</text>
    <rect x="40" y="80" width="180" height="24" rx="4" fill="#1e3a5f" opacity="0.35"/>
    <text x="230" y="97" font-family="Arial, sans-serif" font-size="11" fill="#64748b">снижена</text>
    <text x="40" y="130" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Награда (НС) / амигдала</text>
    <rect x="40" y="140" width="320" height="24" rx="4" fill="#1e3a5f" opacity="0.85"/>
    <text x="370" y="157" font-family="Arial, sans-serif" font-size="11" fill="#64748b">повышена</text>
    <text x="40" y="195" font-family="Arial, sans-serif" font-size="12" fill="#475569">→ снижение когнитивного контроля, рост реакции на стимулы</text>
  </g>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
</svg>